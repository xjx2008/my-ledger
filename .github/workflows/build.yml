name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate platform scaffold
        run: |
          flutter create --platforms=android --project-name ledger_app --org com.ledger /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          rm -rf /tmp/scaffold

      - name: Set app display name
        run: |
          python3 - <<'PY'
          import io, glob
          # 1) App 显示名改为中文
          path = 'android/app/src/main/AndroidManifest.xml'
          with io.open(path, encoding='utf-8') as f:
              content = f.read()
          content = content.replace('android:label="ledger_app"', 'android:label="记账本"')
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('App label set to 记账本')

          # 2) 关闭混淆 + 写 proguard keep，保留 ML Kit 识别器类
          rules = '\n'.join([
              '-keep class com.google.mlkit.** { *; }',
              '-keep class com.google.android.gms.** { *; }',
              '-dontwarn com.google.mlkit.**',
              '-dontwarn com.google.android.gms.**',
          ])
          with io.open('android/app/proguard-rules.pro', 'a', encoding='utf-8') as f:
              f.write('\n' + rules)
          print('proguard keep rules appended')
          PY

      - name: Bundle Chinese OCR model
        run: |
          python3 - <<'PY'
          import io, os
          # google_mlkit_text_recognition 0.14.0 默认只打包拉丁模型，
          # 中文识别必须由 App 自己引入 text-recognition-chinese。
          candidates = [
              ('android/app/build.gradle.kts',
               '    implementation("com.google.mlkit:text-recognition-chinese:16.0.0")\n'),
              ('android/app/build.gradle',
               "    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'\n"),
          ]
          patched = []
          for path, line in candidates:
              if not os.path.exists(path):
                  continue
              with io.open(path, encoding='utf-8') as f:
                  content = f.read()
              if 'text-recognition-chinese' in content:
                  print(path, 'already has chinese model')
                  patched.append(path)
                  continue
              marker = 'dependencies {'
              idx = content.find(marker)
              if idx < 0:
                  # 新脚手架可能连 dependencies 块都没有，直接补一个
                  content = content.rstrip() + '\n\ndependencies {\n' + line + '}\n'
              else:
                  content = content[:idx] + marker + '\n' + line + content[idx + len(marker):]
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(path, 'chinese model dependency added')
              patched.append(path)
          if not patched:
              raise SystemExit('ERROR: android/app/build.gradle[.kts] not found')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter files
        run: flutter analyze --no-pub || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify Chinese OCR is bundled
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p /tmp/apk
          unzip -o -q "$APK" -d /tmp/apk
          if grep -r -a -q "text/chinese" /tmp/apk/classes*.dex; then
            echo "OK: Chinese text recognizer is bundled"
          else
            echo "ERROR: Chinese text recognizer NOT bundled - 识图会闪退"
            exit 1
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ledger-app-${GITHUB_REF_NAME}.apk
        if: startsWith(github.ref, 'refs/tags/')

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ledger-app-*.apk
          generate_release_notes: true
          name: 记账本 ${{ github.ref_name }}
          body: |
            ## 记账本 Android 版

            从 GitHub Releases 下载 `ledger-app-*.apk`，传到手机直接安装即可（需允许安装未知来源应用）。

            ### 功能
            - 手动记账（金额/分类/备注/日期）
            - 识图记账：小票单笔回填；微信/支付宝账单长截图拆成多笔，勾选后批量导入
            - 支出 12 类 + 收入 7 类预设，两边均支持自定义增删改
            - 周/月/年统计 + 自定义日期区间，含分类饼图和收支趋势图
            - 6 套主题风格随时切换，自动记忆
            - 数据全部保存在手机本地，不联网不上传
