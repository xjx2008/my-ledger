name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffold
        run: |
          flutter create --platforms=android --project-name ledger_app --org com.ledger /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          rm -rf /tmp/scaffold

      - name: Set app display name
        run: |
          python3 - <<'PY'
          import io
          path = 'android/app/src/main/AndroidManifest.xml'
          with io.open(path, encoding='utf-8') as f:
              content = f.read()
          # flutter create 默认 label 为项目名 ledger_app，替换为中文显示名
          content = content.replace('android:label="ledger_app"', 'android:label="记账本"')
          with io.open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('App label set to 记账本')

          # ML Kit 需要 compileSdk 35，提升 Gradle 配置（兼容 .gradle 与 .gradle.kts）
          import os, re
          gradle_candidates = ['android/app/build.gradle', 'android/app/build.gradle.kts']
          gradle = next((p for p in gradle_candidates if os.path.exists(p)), None)
          if gradle:
              with io.open(gradle, encoding='utf-8') as f:
                  g = f.read()
              g = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', g)
              g = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', g)
              with io.open(gradle, 'w', encoding='utf-8') as f:
                  f.write(g)
              print('compileSdk=35 in', gradle)
          else:
              print('WARN: gradle file not found, skip compileSdk override')

          # 关闭 R8 混淆：会裁剪掉 ML Kit 的多语言识别器类导致构建失败
          # 覆盖 Groovy(minifyEnabled true) 与 Kotlin DSL(isMinifyEnabled = true / .set(true)) 写法
          import glob
          for gp in glob.glob('android/app/build.gradle*'):
              with io.open(gp, encoding='utf-8') as f:
                  gg = f.read()
              before = gg
              gg = re.sub(r'\bisMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', gg)
              gg = re.sub(r'\bminifyEnabled\s+true', 'minifyEnabled false', gg)
              gg = re.sub(r'minifyEnabled\.set\(true\)', 'minifyEnabled.set(false)', gg)
              gg = re.sub(r'\bisShrinkResources\s*=\s*true', 'isShrinkResources = false', gg)
              gg = re.sub(r'\bshrinkResources\s+true', 'shrinkResources false', gg)
              gg = re.sub(r'shrinkResources\.set\(true\)', 'shrinkResources.set(false)', gg)
              with io.open(gp, 'w', encoding='utf-8') as f:
                  f.write(gg)
              print(gp, 'minify disabled:', before != gg)

          # 双保险：写 proguard keep 规则，保留 ML Kit 识别器类（minify 开关若失效也生效）
          rules = '\n'.join([
              '-keep class com.google.mlkit.** { *; }',
              '-keep class com.google.android.gms.** { *; }',
              '-dontwarn com.google.mlkit.**',
              '-dontwarn com.google.android.gms.**',
          ])
          with io.open('android/app/proguard-rules.pro', 'a', encoding='utf-8') as f:
              f.write('\n' + rules)
          print('proguard keep rules appended')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter files
        run: flutter analyze --no-pub || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ledger-app-${GITHUB_REF_NAME}.apk
        if: startsWith(github.ref, 'refs/tags/')

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ledger-app-*.apk
          generate_release_notes: true
          name: 记账本 ${{ github.ref_name }}
          body: |
            ## 记账本 Android 版

            从 GitHub Releases 下载 `ledger-app-*.apk`，传到手机直接安装即可（需允许安装未知来源应用）。

            ### 功能
            - 手动记账（金额/分类/备注/日期）
            - 支出 12 类 + 收入 7 类预设，两边均支持自定义增删改
            - 周/月/年统计 + 自定义日期区间，含分类饼图和收支趋势图
            - 6 套主题风格随时切换，自动记忆
            - 数据全部保存在手机本地，不联网不上传
